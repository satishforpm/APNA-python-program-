<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>APNA Python Program</title>
<meta name="description" content="Learn Python and run real code online — free, no signup. Plus a JavaScript, TypeScript, HTML/CSS and multi-language compiler." />
<style>
:root{
  --bg: #0b1424;
  --bg-alt: #0f1b30;
  --panel: #101d33;
  --panel-2: #142640;
  --border: #22324d;
  --text: #e7edf7;
  --text-dim: #9fb0c8;
  --text-faint: #6d7f9c;
  --blue: #3b82f6;
  --blue-dim: #2563eb;
  --blue-bright: #60a5fa;
  --yellow: #f4c542;
  --green: #34d399;
  --red: #f87171;
  --editor-bg: #0d1526;
  --radius: 10px;
  --header-h: 56px;
  --mono: "JetBrains Mono","Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body.theme-light{
  --bg:#f4f6fb; --bg-alt:#ffffff; --panel:#ffffff; --panel-2:#eef1f8;
  --border:#dbe2ef; --text:#101828; --text-dim:#48546b; --text-faint:#7a8aa5;
  --editor-bg:#0d1526;
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; }
svg{ width:20px; height:20px; }
::selection{ background: rgba(59,130,246,.35); }

#app{ min-height:100%; display:flex; flex-direction:column; }

/* ===== HEADER ===== */
.topbar{
  height:var(--header-h); flex:0 0 auto; display:flex; align-items:center; gap:12px;
  padding:0 10px; background:linear-gradient(180deg,#0d1830,#0a1322);
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:40;
}
.topbar-left{ display:flex; align-items:center; gap:8px; min-width:0; }
.icon-btn{
  background:transparent; border:none; color:var(--text-dim); width:36px; height:36px;
  border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  flex:0 0 auto;
}
.icon-btn:hover{ background:rgba(255,255,255,.06); color:var(--text); }
.brand{ display:flex; align-items:center; gap:8px; min-width:0; }
.brand-mark{ height:28px; width:auto; flex:0 0 auto; }
.brand-word{ font-weight:800; font-size:15px; letter-spacing:.2px; white-space:nowrap; color:var(--text); }
.brand-word-accent{ color:var(--blue-bright); }
.topbar-title{
  flex:1 1 auto; min-width:0; text-align:center; font-size:13px; color:var(--text-dim);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;
}
.topbar-right{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }

@media (max-width:640px){
  .brand-word{ display:none; }
  .topbar-title{ font-size:12px; }
}

/* ===== SIDE NAV ===== */
.nav-overlay{
  position:fixed; inset:0; background:rgba(3,7,16,.6); backdrop-filter:blur(2px);
  opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:49;
}
.nav-overlay.open{ opacity:1; pointer-events:auto; }
.side-nav{
  position:fixed; top:0; left:0; bottom:0; width:300px; max-width:86vw;
  background:var(--bg-alt); border-right:1px solid var(--border);
  transform:translateX(-100%); transition:transform .22s ease; z-index:50;
  display:flex; flex-direction:column;
}
.side-nav.open{ transform:translateX(0); }
.side-nav-head{
  display:flex; align-items:center; gap:10px; padding:14px 12px; border-bottom:1px solid var(--border);
  flex:0 0 auto;
}
.side-nav-mark{ height:26px; }
.side-nav-name{ font-weight:800; font-size:14px; flex:1 1 auto; }
.side-nav-content{ flex:1 1 auto; overflow-y:auto; padding:8px 6px 16px; }
.side-nav-foot{ padding:12px; border-top:1px solid var(--border); flex:0 0 auto; }
.side-nav-note{ font-size:11px; color:var(--text-faint); text-align:center; margin:8px 0 0; }

.nav-group{ margin:6px 4px 14px; }
.nav-group-title{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint);
  padding:6px 10px; font-weight:700;
}
.nav-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
  font-size:14px; color:var(--text-dim); cursor:pointer;
}
.nav-link:hover{ background:rgba(255,255,255,.05); color:var(--text); }
.nav-link.active{ background:rgba(59,130,246,.15); color:var(--blue-bright); }
.nav-link .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); flex:0 0 auto; }
.nav-link.active .dot{ background:var(--blue-bright); }

/* ===== MAIN ===== */
.main-content{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }

.btn{
  border:1px solid var(--border); background:var(--panel-2); color:var(--text);
  padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn:hover{ filter:brightness(1.15); }
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ background:var(--blue-dim); border-color:var(--blue-dim); color:#fff; }
.btn-ghost{ background:transparent; }
.btn-sm{ padding:6px 10px; font-size:12px; }
.btn-block{ width:100%; justify-content:center; }
.btn-danger{ background:transparent; border-color:var(--red); color:var(--red); }

/* ===== HOME ===== */
.home{ padding:28px 18px 60px; max-width:980px; margin:0 auto; width:100%; }
.hero{ padding:34px 0 18px; }
.hero h1{ font-size:30px; margin:0 0 10px; line-height:1.15; }
.hero .accent{ color:var(--blue-bright); }
.hero p{ color:var(--text-dim); font-size:15px; max-width:60ch; line-height:1.6; }
.hero-actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:22px; }
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:border-color .15s, transform .15s;
}
.card:hover{ border-color:var(--blue-dim); transform:translateY(-2px); }
.card h3{ margin:0 0 6px; font-size:15px; }
.card p{ margin:0; font-size:12.5px; color:var(--text-faint); line-height:1.5; }
.section-heading{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin:30px 0 4px; font-weight:700; }

/* ===== COMPILER LAYOUT ===== */
.compiler{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
.compiler-toolbar{
  display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--bg-alt);
  border-bottom:1px solid var(--border); flex-wrap:wrap;
}
.tabs{ display:flex; gap:4px; }
.tab{
  padding:7px 14px; border-radius:8px 8px 0 0; font-size:13px; font-weight:600; cursor:pointer;
  color:var(--text-dim); background:transparent; border:1px solid transparent;
}
.tab.active{ background:var(--editor-bg); color:var(--text); border-color:var(--border); border-bottom-color:var(--editor-bg); }
.toolbar-spacer{ flex:1 1 auto; }
.status-pill{
  font-size:11px; padding:4px 9px; border-radius:99px; border:1px solid var(--border); color:var(--text-faint);
}
.status-pill.running{ color:var(--yellow); border-color:var(--yellow); }
.status-pill.ok{ color:var(--green); border-color:var(--green); }
.status-pill.error{ color:var(--red); border-color:var(--red); }

.compiler-body{ flex:1 1 auto; min-height:0; display:flex; }
.pane{ flex:1 1 50%; min-width:0; display:flex; flex-direction:column; min-height:0; }
.pane + .pane{ border-left:1px solid var(--border); }
.pane-editor .CodeMirror{ flex:1 1 auto; height:100% !important; font-family:var(--mono); font-size:13.5px; }
.pane-hidden{ display:none !important; }

.output-panel{ flex:1 1 auto; overflow:auto; background:var(--editor-bg); padding:12px 14px; font-family:var(--mono); font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
.output-panel .err{ color:var(--red); }
.output-panel .ok-text{ color:var(--green); }
.output-panel .dim{ color:var(--text-faint); }
.output-panel .stdin-echo{ color:var(--blue-bright); }

.input-row{ display:flex; gap:8px; padding:8px 10px; border-top:1px solid var(--border); background:var(--bg-alt); align-items:center; }
.input-row input{
  flex:1 1 auto; background:var(--editor-bg); border:1px solid var(--border); color:var(--text);
  padding:8px 10px; border-radius:8px; font-family:var(--mono); font-size:13px;
}
.input-row.hidden{ display:none; }

.compiler-footbar{ display:flex; justify-content:flex-end; gap:8px; padding:10px; border-top:1px solid var(--border); background:var(--bg-alt); }

@media (max-width:820px){
  .compiler-body{ flex-direction:column; }
  .pane + .pane{ border-left:none; border-top:1px solid var(--border); }
  .compiler-body.mobile-single .pane{ display:none; flex:1 1 100%; }
  .compiler-body.mobile-single .pane.mobile-active{ display:flex; }
}

.fullscreen-mode .compiler{ position:fixed; inset:0; z-index:60; background:var(--bg); }

/* ===== HTML/CSS editor (3 panes) ===== */
.htmlcss-body{ flex:1 1 auto; min-height:0; display:flex; }
.htmlcss-col{ flex:1 1 33%; min-width:0; display:flex; flex-direction:column; border-left:1px solid var(--border); }
.htmlcss-col:first-child{ border-left:none; }
.htmlcss-col .col-label{ font-size:11px; padding:6px 10px; color:var(--text-faint); background:var(--bg-alt); border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.05em; }
.htmlcss-col .CodeMirror{ flex:1 1 auto; height:100% !important; font-family:var(--mono); font-size:13px; }
#hc-preview{ flex:1 1 auto; border:none; width:100%; height:100%; background:#fff; }
@media (max-width:900px){
  .htmlcss-body{ flex-direction:column; }
  .htmlcss-col{ border-left:none; border-top:1px solid var(--border); min-height:160px; }
}

/* ===== TUTORIAL ===== */
.tutorial{ display:flex; flex:1 1 auto; min-height:0; }
.tutorial-sidebar{
  width:250px; flex:0 0 auto; border-right:1px solid var(--border); overflow-y:auto; background:var(--bg-alt);
  padding:10px 6px;
}
.tutorial-main{ flex:1 1 auto; overflow-y:auto; padding:24px 26px 60px; max-width:900px; }
.lesson-kicker{ color:var(--text-faint); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
.lesson-title{ font-size:26px; margin:0 0 14px; }
.lesson-body{ color:var(--text-dim); font-size:15px; line-height:1.75; }
.lesson-body p{ margin:0 0 14px; }
.lesson-body code{ background:var(--panel-2); padding:2px 6px; border-radius:5px; font-family:var(--mono); font-size:.9em; color:var(--blue-bright); }
.code-block{
  background:var(--editor-bg); border:1px solid var(--border); border-radius:8px; padding:12px 14px;
  font-family:var(--mono); font-size:13px; color:#dbe4f5; overflow-x:auto; margin:14px 0; white-space:pre;
}
.lesson-editor-wrap{ margin-top:22px; }
.lesson-editor-wrap .CodeMirror{ height:220px; border-radius:8px 8px 0 0; font-family:var(--mono); font-size:13.5px; }
.lesson-toolbar{ display:flex; gap:8px; padding:8px; background:var(--bg-alt); border:1px solid var(--border); border-top:none; }
.lesson-output{ background:var(--editor-bg); border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; padding:12px 14px; font-family:var(--mono); font-size:13px; min-height:56px; white-space:pre-wrap; }
.lesson-nav{ display:flex; justify-content:space-between; margin-top:26px; gap:10px; }

.tutorial-toc-group{ margin-bottom:6px; }
.tutorial-toc-title{ font-size:11px; text-transform:uppercase; color:var(--text-faint); padding:8px 10px 4px; font-weight:700; letter-spacing:.06em; }
.tutorial-toc-link{ display:block; padding:7px 10px; border-radius:7px; font-size:13.5px; color:var(--text-dim); }
.tutorial-toc-link:hover{ background:rgba(255,255,255,.05); }
.tutorial-toc-link.active{ background:rgba(59,130,246,.15); color:var(--blue-bright); font-weight:600; }

@media (max-width:820px){
  .tutorial{ flex-direction:column; }
  .tutorial-sidebar{ width:100%; max-height:180px; border-right:none; border-bottom:1px solid var(--border); }
  .tutorial-main{ padding:18px 16px 50px; }
}

/* ===== Piston / remote languages ===== */
.remote-note{ background:var(--panel-2); border:1px solid var(--border); border-left:3px solid var(--blue); padding:10px 12px; font-size:12.5px; color:var(--text-dim); border-radius:0 8px 8px 0; margin:10px; }

/* ===== Loading ===== */
.loading-row{ display:flex; align-items:center; gap:10px; padding:14px; color:var(--text-dim); font-size:13px; }
.spinner{ width:16px; height:16px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--blue-bright); animation:spin .7s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.empty-state{ padding:40px 20px; text-align:center; color:var(--text-faint); }

/* ===== FOOTER ===== */
.site-footer{
  flex:0 0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 16px; background:linear-gradient(180deg,#0a1322,#080f1c);
  border-top:1px solid var(--border);
}
.footer-logo{
  width:40px; height:40px; border-radius:50%; flex:0 0 auto; object-fit:cover;
  border:2px solid var(--blue-dim);
}
.footer-info{ flex:1 1 auto; min-width:150px; line-height:1.35; }
.footer-name{ font-size:13px; font-weight:700; color:var(--text); }
.footer-role{ font-size:11.5px; color:var(--text-dim); }
.footer-phone a{ font-size:11.5px; color:var(--text-faint); }
.footer-phone a:hover{ color:var(--blue-bright); }
.footer-social{ display:flex; gap:8px; flex:0 0 auto; }
.footer-icon{
  width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); border:1px solid var(--border); background:var(--panel-2);
}
.footer-icon svg{ width:16px; height:16px; }
.footer-icon:hover{ color:var(--blue-bright); border-color:var(--blue-dim); }

@media (max-width:480px){
  .site-footer{ justify-content:center; text-align:center; padding:10px 12px; }
  .footer-info{ text-align:left; }
}

/* utility */
.hidden{ display:none !important; }

</style>

<script>
// Real Python execution using Pyodide (CPython compiled to WebAssembly).
// Loaded lazily -- only when a Python compiler/tutorial page is opened.
const PyRunner = (() => {
  let pyodidePromise = null;
  let pyodide = null;

  function load(onProgress) {
    if (pyodidePromise) return pyodidePromise;
    pyodidePromise = new Promise(async (resolve, reject) => {
      try {
        onProgress && onProgress("Fetching Python runtime (Pyodide)...");
        if (!window.loadPyodide) {
          await loadScript("https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js");
        }
        onProgress && onProgress("Starting Python interpreter...");
        pyodide = await window.loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
        });
        resolve(pyodide);
      } catch (err) {
        pyodidePromise = null;
        reject(err);
      }
    });
    return pyodidePromise;
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error("Could not load " + src));
      document.head.appendChild(s);
    });
  }

  // Detects whether code calls input(), so the UI can ask for stdin lines up front.
  function usesInput(code) {
    return /(^|[^.\w])input\s*\(/.test(code);
  }

  /**
   * Runs python code.
   * stdinLines: array of strings the program's input() calls will receive, in order.
   * callbacks: { onStdout(text), onStderr(text) } - called incrementally.
   * Returns { ok:boolean, error:string|null }
   */
  async function run(code, stdinLines, callbacks = {}) {
    const py = pyodide;
    let stdinIndex = 0;

    py.globals.set("__stdin_lines", stdinLines);
    py.globals.set("__stdin_index_holder", [0]);

    py.setStdout({ batched: (text) => callbacks.onStdout && callbacks.onStdout(text + "\n") });
    py.setStderr({ batched: (text) => callbacks.onStderr && callbacks.onStderr(text + "\n") });

    const setupCode = `
import builtins, js as __js

def __web_input(prompt=""):
    if prompt:
        print(prompt, end="")
    idx = __stdin_index_holder[0]
    lines = __stdin_lines
    if idx < len(lines):
        __stdin_index_holder[0] = idx + 1
        val = lines[idx]
        print(val)
        return val
    print()
    return ""

builtins.input = __web_input
`;

    try {
      await py.runPythonAsync(setupCode);
      await py.runPythonAsync(code);
      return { ok: true, error: null };
    } catch (err) {
      const message = formatPyError(err);
      callbacks.onStderr && callbacks.onStderr(message + "\n");
      return { ok: false, error: message };
    }
  }

  function formatPyError(err) {
    const msg = (err && err.message) ? err.message : String(err);
    // Pyodide throws PythonError with a full traceback; keep the most useful tail.
    const lines = msg.split("\n").filter(Boolean);
    return lines.slice(-3).join("\n");
  }

  function isLoaded() { return !!pyodide; }

  return { load, run, usesInput, isLoaded };
})();

// Real JavaScript execution in a sandboxed Web Worker.
// Running in a worker means: (1) it can't touch the page/DOM, (2) an infinite loop
// doesn't freeze the UI, and (3) we can actually cancel it with a Stop button.
const JsRunner = (() => {
  let worker = null;

  const WORKER_SRC = `
    self.onmessage = function(e) {
      const code = e.data.code;
      const log = (level, args) => {
        const text = args.map(a => {
          try {
            if (typeof a === "string") return a;
            return JSON.stringify(a, null, 2);
          } catch (err) { return String(a); }
        }).join(" ");
        self.postMessage({ type: "log", level, text });
      };
      const console = {
        log: (...a) => log("log", a),
        info: (...a) => log("info", a),
        warn: (...a) => log("warn", a),
        error: (...a) => log("error", a),
      };
      try {
        const fn = new Function("console", code);
        fn(console);
        self.postMessage({ type: "done" });
      } catch (err) {
        self.postMessage({ type: "error", message: (err && err.message) ? err.message : String(err) });
      }
    };
  `;

  function run(code, { onLog, onError, onDone, timeoutMs = 8000 } = {}) {
    return new Promise((resolve) => {
      stop(); // ensure only one running at a time
      const blob = new Blob([WORKER_SRC], { type: "application/javascript" });
      worker = new Worker(URL.createObjectURL(blob));

      const timer = setTimeout(() => {
        onError && onError("Execution timed out (possible infinite loop). Stopped after " + (timeoutMs / 1000) + "s.");
        stop();
        resolve({ ok: false, timedOut: true });
      }, timeoutMs);

      worker.onmessage = (e) => {
        const msg = e.data;
        if (msg.type === "log") { onLog && onLog(msg.level, msg.text); }
        else if (msg.type === "error") {
          clearTimeout(timer);
          onError && onError(msg.message);
          onDone && onDone();
          stop();
          resolve({ ok: false });
        } else if (msg.type === "done") {
          clearTimeout(timer);
          onDone && onDone();
          stop();
          resolve({ ok: true });
        }
      };
      worker.onerror = (e) => {
        clearTimeout(timer);
        onError && onError(e.message || "Unknown worker error");
        onDone && onDone();
        stop();
        resolve({ ok: false });
      };
      worker.postMessage({ code });
    });
  }

  function stop() {
    if (worker) { worker.terminate(); worker = null; }
  }

  return { run, stop };
})();

</script>

<script>
// Real remote execution for languages that can't run inside the browser
// (Java, C, C++, C#, Go, Rust, PHP, Ruby, Swift, Kotlin, Dart, Scala).
// Uses Piston (https://github.com/engineer-man/piston), a free, open-source,
// sandboxed code-execution service with a public API. No API key required,
// so nothing secret is ever exposed in the frontend.
const PistonRunner = (() => {
  const API_BASE = "https://emkc.org/api/v2/piston";
  let runtimesPromise = null;

  function getRuntimes() {
    if (!runtimesPromise) {
      runtimesPromise = fetch(API_BASE + "/runtimes").then(r => {
        if (!r.ok) throw new Error("Could not reach the execution service.");
        return r.json();
      });
    }
    return runtimesPromise;
  }

  async function resolveRuntime(aliases) {
    const runtimes = await getRuntimes();
    for (const alias of aliases) {
      const match = runtimes.find(r =>
        r.language === alias || (r.aliases || []).includes(alias)
      );
      if (match) return match;
    }
    return null;
  }

  /**
   * Executes code remotely.
   * Returns { ok, stdout, stderr, compileOutput, error }
   */
  async function run(aliases, fileName, code, stdin = "") {
    let runtime;
    try {
      runtime = await resolveRuntime(aliases);
    } catch (err) {
      return { ok: false, error: "Could not reach the execution service. Check your internet connection and try again." };
    }
    if (!runtime) {
      return { ok: false, error: "This language isn't available on the execution service right now." };
    }

    try {
      const res = await fetch(API_BASE + "/execute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          language: runtime.language,
          version: runtime.version,
          files: [{ name: fileName, content: code }],
          stdin: stdin,
        })
      });
      if (!res.ok) {
        return { ok: false, error: "Execution service returned an error (HTTP " + res.status + ")." };
      }
      const data = await res.json();
      const compile = data.compile || null;
      const run = data.run || {};
      return {
        ok: (run.code === 0) && (!compile || compile.code === 0),
        stdout: run.stdout || "",
        stderr: run.stderr || "",
        compileOutput: compile ? (compile.stderr || compile.output || "") : "",
        signal: run.signal || null,
      };
    } catch (err) {
      return { ok: false, error: "Network error while contacting the execution service." };
    }
  }

  return { run, resolveRuntime };
})();

</script>

          <div id="editorHost" style="flex:1 1 auto; min-height:0;"></div>
          ${cfg.engine === "pyodide" ? `
          <div class="input-row hidden" id="stdinRow">
            <input type="text" id="stdinArea" placeholder="This program uses input() — enter each value on its own line, in order it will be requested" />
          </div>` : ``}
        </div>
        <div class="pane pane-output" id="outputPane">
          <div class="output-panel" id="outputPanel"><span class="dim">Output will appear here after you press Run.</span></div>
        </div>
      </div>

      <div class="compiler-footbar">
        <button class="btn btn-ghost" id="copyBtn">Copy Code</button>
        <button class="btn btn-ghost" id="resetBtn">Reset</button>
        <button class="btn btn-ghost" id="clearOutputBtn">Clear Output</button>
        ${cfg.engine === "pyodide" ? `<button class="btn btn-ghost" id="visualizeBtn">Visualize</button>` : ``}
        <button class="btn btn-primary" id="runBtn">▶ Run</button>
      </div>
    </div>
  `;

  const editorHost = container.querySelector("#editorHost");
  const cm = createEditor(editorHost, { mode: cfg.cmMode, value: cfg.defaultCode });
  setTimeout(() => cm.refresh(), 30);

  const outputPanel = container.querySelector("#outputPanel");
  const statusPill = container.querySelector("#statusPill");
  const runBtn = container.querySelector("#runBtn");
  const compilerBody = container.querySelector("#compilerBody");
  const editorPane = container.querySelector("#editorPane");
  const outputPane = container.querySelector("#outputPane");

  function setStatus(text, cls) {
    statusPill.textContent = text;
    statusPill.className = "status-pill" + (cls ? " " + cls : "");
  }

  function clearOutput() {
    outputPanel.innerHTML = `<span class="dim">Output will appear here after you press Run.</span>`;
  }
  function appendOutput(text, cls) {
    if (outputPanel.querySelector(".dim") && outputPanel.children.length === 1 && outputPanel.textContent.includes("Output will appear")) {
      outputPanel.innerHTML = "";
    }
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = text;
    outputPanel.appendChild(span);
    outputPanel.scrollTop = outputPanel.scrollHeight;
  }

  // Tabs (mobile pane switch)
  container.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      container.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      compilerBody.classList.add("mobile-single");
      const which = tab.dataset.pane;
      editorPane.classList.toggle("mobile-active", which === "editor");
      outputPane.classList.toggle("mobile-active", which === "output");
      cm.refresh();
    });
  });
  function switchToOutputTab() {
    const outTab = container.querySelector('.tab[data-pane="output"]');
    if (outTab) outTab.click();
  }

  container.querySelector("#copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(cm.getValue());
      flashButton(container.querySelector("#copyBtn"), "Copied!");
    } catch { flashButton(container.querySelector("#copyBtn"), "Press Ctrl+C"); }
  });
  container.querySelector("#resetBtn").addEventListener("click", () => {
    cm.setValue(cfg.defaultCode);
    clearOutput();
    setStatus("Ready");
  });
  container.querySelector("#clearOutputBtn").addEventListener("click", clearOutput);

  container.querySelector("#fullscreenBtn").addEventListener("click", () => {
    document.body.classList.toggle("fullscreen-mode");
    setTimeout(() => cm.refresh(), 60);
  });

  container.querySelector("#moreBtn").addEventListener("click", () => {
    appendOutput("\n[info] Compiler tools: Run, Reset, Clear Output, Copy Code, Fullscreen, Visualize (Python).\n", "dim");
    switchToOutputTab();
  });

  // ---- STDIN (Python) ----
  const stdinRow = container.querySelector("#stdinRow");
  const stdinArea = container.querySelector("#stdinArea");
  if (cfg.engine === "pyodide") {
    cm.on("change", () => {
      const needsInput = PyRunner.usesInput(cm.getValue());
      stdinRow.classList.toggle("hidden", !needsInput);
    });
    if (PyRunner.usesInput(cfg.defaultCode)) stdinRow.classList.remove("hidden");
  }

  // ---- RUN ----
  let running = false;
  runBtn.addEventListener("click", () => runCode());

  async function runCode() {
    if (running) return;
    running = true;
    runBtn.disabled = true;
    clearOutput();
    switchToOutputTab();
    setStatus("Running...", "running");

    try {
      if (cfg.engine === "pyodide") {
        await runPython();
      } else if (cfg.engine === "js-native") {
        await runJs(cm.getValue());
      } else if (cfg.engine === "ts") {
        await runTs(cm.getValue());
      } else if (cfg.engine === "piston") {
        await runPiston();
      }
    } finally {
      running = false;
      runBtn.disabled = false;
    }
  }

  async function runPython() {
    if (!PyRunner.isLoaded()) {
      appendOutput("Loading Python runtime (first run only)...\n", "dim");
      try {
        await PyRunner.load((msg) => { outputPanel.lastChild.textContent = msg + "\n"; });
      } catch (e) {
        appendOutput("Failed to load the Python runtime. Check your internet connection.\n", "err");
        setStatus("Error", "error");
        return;
      }
      clearOutput();
    }
    const stdinLines = stdinArea && stdinArea.value ? stdinArea.value.split("\n") : [];
    const result = await PyRunner.run(cm.getValue(), stdinLines, {
      onStdout: (t) => appendOutput(t),
      onStderr: (t) => appendOutput(t, "err"),
    });
    setStatus(result.ok ? "Completed" : "Error", result.ok ? "ok" : "error");
  }

  async function runJs(code) {
    await JsRunner.run(code, {
      onLog: (level, text) => appendOutput(text + "\n", level === "error" ? "err" : (level === "warn" ? "" : "")),
      onError: (msg) => appendOutput(msg + "\n", "err"),
      onDone: () => {},
    }).then(res => setStatus(res.ok ? "Completed" : "Error", res.ok ? "ok" : "error"));
  }

  async function runTs(code) {
    let js;
    try {
      js = window.ts.transpileModule(code, {
        compilerOptions: { target: window.ts.ScriptTarget.ES2020, module: window.ts.ModuleKind.None }
      }).outputText;
    } catch (e) {
      appendOutput("TypeScript compile error:\n" + (e.message || e) + "\n", "err");
      setStatus("Error", "error");
      return;
    }
    await runJs(js);
  }

  async function runPiston() {
    appendOutput("Sending code to the secure execution service...\n", "dim");
    const result = await PistonRunner.run(cfg.pistonAliases, cfg.fileName, cm.getValue(), "");
    clearOutput();
    if (result.error) {
      appendOutput(result.error + "\n", "err");
      setStatus("Error", "error");
      return;
    }
    if (result.compileOutput) appendOutput(result.compileOutput + "\n", "err");
    if (result.stdout) appendOutput(result.stdout);
    if (result.stderr) appendOutput(result.stderr, "err");
    if (!result.stdout && !result.stderr && !result.compileOutput) appendOutput("(no output)\n", "dim");
    setStatus(result.ok ? "Completed" : "Error", result.ok ? "ok" : "error");
  }

  // ---- VISUALIZE (Python step trace) ----
  const visualizeBtn = container.querySelector("#visualizeBtn");
  if (visualizeBtn) {
    visualizeBtn.addEventListener("click", async () => {
      switchToOutputTab();
      clearOutput();
      appendOutput("Building execution trace...\n", "dim");
      if (!PyRunner.isLoaded()) {
        try { await PyRunner.load(); } catch (e) {
          clearOutput(); appendOutput("Could not load the Python runtime.\n", "err"); return;
        }
      }
      const trace = await buildPyTrace(cm.getValue());
      clearOutput();
      if (trace.error) { appendOutput(trace.error + "\n", "err"); return; }
      if (!trace.steps.length) { appendOutput("No executable steps were recorded.\n", "dim"); return; }
      trace.steps.forEach((s, i) => {
        appendOutput(`Step ${i + 1}  (line ${s.line})\n`, "ok-text");
        appendOutput(`  ${s.code}\n`);
      });
      appendOutput(`\nTotal steps executed: ${trace.steps.length}${trace.truncated ? " (truncated at 200 steps)" : ""}\n`, "dim");
    });
  }

  if (cfg.engine === "pyodide") {
    PyRunner.load().catch(() => {});
  }
}

async function buildPyTrace(code) {
  // Uses Python's sys.settrace to record which source line runs, in order.
  const pyodide = await PyRunner.load().catch(() => null);
  if (!pyodide) return { error: "Python runtime unavailable." };

  const lines = code.split("\n");
  const traceSetup = `
import sys, json as __json

__trace_steps = []
__src_lines = ${JSON.stringify(lines)}

def __tracer(frame, event, arg):
    if event == "line" and frame.f_code.co_filename == "<usercode>":
        lineno = frame.f_lineno
        if 1 <= lineno <= len(__src_lines):
            if len(__trace_steps) < 200:
                __trace_steps.append({"line": lineno, "code": __src_lines[lineno - 1].strip()})
    return __tracer

sys.settrace(__tracer)
`;
  const teardown = `sys.settrace(None)`;
  try {
    await pyodide.runPythonAsync(traceSetup);
    let userError = null;
    try {
      await pyodide.runPythonAsync(
        `compiled_code = compile(${JSON.stringify(code)}, "<usercode>", "exec")\nexec(compiled_code, {})`
      );
    } catch (e) {
      userError = (e && e.message) ? e.message.split("\n").slice(-2).join("\n") : String(e);
    }
    await pyodide.runPythonAsync(teardown);
    const steps = pyodide.globals.get("__trace_steps").toJs({ dict_converter: Object.fromEntries });
    return { steps: steps || [], truncated: (steps || []).length >= 200, error: userError };
  } catch (e) {
    return { error: "Could not build the execution trace." };
  }
}

function flashButton(btn, text) {
  const original = btn.textContent;
  btn.textContent = text;
  setTimeout(() => { btn.textContent = original; }, 1200);
}

</script>

          <div class="card" onclick="location.hash='#/compiler/${l.id}'">
            <h3>${escapeHtml(l.name)}</h3>
            <p>Real compilation and execution.</p>
          </div>
        `).join("")}
        <div class="card" onclick="location.hash='#/compiler/typescript'">
          <h3>TypeScript</h3>
          <p>Compiled and run right in your browser.</p>
        </div>
      </div>
    </div>
  `;
}

</script>
<script>
const mainContent = document.getElementById("mainContent");
const pageTitleEl = document.getElementById("pageTitle");

function setPageTitle(title) {
  pageTitleEl.textContent = title;
  document.title = title + " · APNA Python Program";
}

// ---------- ROUTER ----------
function router() {
  const hash = location.hash || "#/";
  const parts = hash.replace(/^#\//, "").split("/").filter(Boolean);
  document.body.classList.remove("fullscreen-mode");
  JsRunner.stop();

  if (parts.length === 0) {
    renderHomePage(mainContent);
  } else if (parts[0] === "python-tutorial") {
    renderTutorialPage(mainContent, parts[1] || "introduction");
  } else if (parts[0] === "compiler") {
    const id = parts[1] || "python";
    if (id === "htmlcss") renderHtmlCssPage(mainContent);
    else renderCompilerPage(mainContent, id);
  } else {
    mainContent.innerHTML = `<div class="empty-state">Page not found. <a href="#/">Go home</a></div>`;
  }
  renderSideNav();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);

// ---------- SIDE NAV ----------
const ICONS = {
  book: `<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20" stroke="currentColor" stroke-width="1.6"/></svg>`,
  play: `<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z" fill="currentColor"/></svg>`,
  code: `<svg viewBox="0 0 24 24"><path d="M8 6L2 12l6 6M16 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

function renderSideNav() {
  const navContent = document.getElementById("navContent");
  const hash = location.hash || "#/";
  navContent.innerHTML = MENU.map(group => `
    <div class="nav-group">
      <div class="nav-group-title">${escapeHtml(group.group)}</div>
      ${group.items.map(item => `
        <a class="nav-link ${hash === item.route ? "active" : ""}" href="${item.route}">
          ${ICONS[item.icon] || `<span class="dot"></span>`}
          <span>${escapeHtml(item.label)}</span>
        </a>
      `).join("")}
    </div>
  `).join("");

  navContent.querySelectorAll(".nav-link").forEach(link => {
    link.addEventListener("click", closeNav);
  });
}

const sideNav = document.getElementById("sideNav");
const navOverlay = document.getElementById("navOverlay");
function openNav() { sideNav.classList.add("open"); navOverlay.classList.add("open"); }
function closeNav() { sideNav.classList.remove("open"); navOverlay.classList.remove("open"); }
document.getElementById("hamburgerBtn").addEventListener("click", openNav);
document.getElementById("navCloseBtn").addEventListener("click", closeNav);
navOverlay.addEventListener("click", closeNav);

// ---------- THEME ----------
const THEME_KEY = "apna_theme_pref";
function applyTheme(mode) {
  document.body.classList.toggle("theme-light", mode === "light");
}
(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY) || "dark";
  applyTheme(saved);
})();
document.getElementById("themeBtn").addEventListener("click", () => {
  const isLight = document.body.classList.contains("theme-light");
  const next = isLight ? "dark" : "light";
  applyTheme(next);
  localStorage.setItem(THEME_KEY, next);
});

</script>
